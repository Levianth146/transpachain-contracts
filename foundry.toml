[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai" # safe for Avalanche C-Chain / Fuji
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256 }

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
